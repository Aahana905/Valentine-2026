<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Valentine Agreement 2026 ??</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #ff6f91, #ff9671);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        section {
            display: none;
            height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
        }

        .text {
            max-width: 600px;
            font-size: 1.2rem;
            margin: 15px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .show {
            opacity: 1;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            background: white;
            color: #ff4e7a;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 20px;
            animation: float 5s linear forwards;
        }

        @keyframes float {
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<!-- PAGE 1 -->
<section id="page1" style="display:flex;">
    <h1>Valentine Agreement 2026</h1>
    <p>By continuing, you agree to the following terms and conditions.</p>
    <button onclick="nextPage('page2')">Proceed (You don’t have a choice ??)</button>
</section>

<!-- PAGE 2 -->
<section id="page2">
    <h1>Terms & Conditions</h1>
    <div id="termsText" class="text">Click to reveal the terms...</div>
    <button onclick="nextPage('page3')">I accept my fate.</button>
</section>

<!-- PAGE 3 -->
<section id="page3">
    <h1>One More Thing...</h1>
    <div class="text show">
        Jokes aside...<br><br>
        Thank you for choosing me.<br><br>
        I’m really happy it’s you.<br><br>
        Out of everyone… it’s you.
    </div>
    <button onclick="signContract()">Sign the Contract ??</button>
</section>

<script>

function nextPage(id) {
    document.querySelectorAll("section").forEach(sec => sec.style.display = "none");
    document.getElementById(id).style.display = "flex";
}

const terms = [
    "You must accept random compliments at any time.",
    "You must tolerate excessive affection.",
    "You must continue flirting at professional level.",
    "You must allow teasing retaliation.",
    "You must send at least one cute message daily.",
    "Failure to comply results in extra hugs."
];

let termIndex = -1;
const termsText = document.getElementById("termsText");

termsText.addEventListener("click", function() {
    termIndex++;
    if (termIndex < terms.length) {
        termsText.classList.remove("show");
        setTimeout(() => {
            termsText.textContent = terms[termIndex];
            termsText.classList.add("show");
        }, 200);
    }
});

function signContract() {
    document.body.innerHTML = `
        <div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:linear-gradient(to bottom right,#ff6f91,#ff9671); color:white;">
            <h1 style="font-family:'Dancing Script', cursive; font-size:3rem;">
                Contract Accepted ❤️
            </h1>
            <p style="font-size:1.3rem; max-width:500px;">
                Officially the luckiest Valentine alive.<br><br>
                I’m really glad it’s you.
            </p>
        </div>
    `;
    celebrate();
}

function celebrate() {
    for (let i = 0; i < 70; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }
}

</script>

</body>
</html>
